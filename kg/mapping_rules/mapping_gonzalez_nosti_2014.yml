prefixes:
  emo-resource: 'https://w3id.org/citius-kg/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'

mappings:
  acquisitionAge:
    sources:
    - [gonzalez_nosti_2014.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/acquisitionAge/gonzalez_nosti_2014/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:AcquisitionAge']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/gonzalez_nosti_2014']
    - ['emolex:affects', 'emo-resource:lexical_entry/gonzalez_nosti_2014/$(palabra_noaccents)~iri']
    - ['rb:mean', $(edad_de_adquisicion_m), 'xsd:float']
  timeNaming:
    sources:
    - [gonzalez_nosti_2014.csv~csv]
    s: emo-resource:annotation/recognitionTime/timeNaming/gonzalez_nosti_2014/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:RecognitionTime', 'emolex:TimeNaming']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/gonzalez_nosti_2014']
    - ['emolex:affects', 'emo-resource:lexical_entry/gonzalez_nosti_2014/$(palabra_noaccents)~iri']
    - ['emolex:recognitionTime', $(tiempo_naming), 'xsd:float']
  timeTdl:
    sources:
    - [gonzalez_nosti_2014.csv~csv]
    s: emo-resource:annotation/recognitionTime/timeTdl/gonzalez_nosti_2014/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:RecognitionTime', 'emolex:TimeTDL']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/gonzalez_nosti_2014']
    - ['emolex:affects', 'emo-resource:lexical_entry/gonzalez_nosti_2014/$(palabra_noaccents)~iri']
    - ['emolex:recognitionTime', $(tiempo_tdl), 'xsd:float']
