prefixes:
  emo-resource: 'https://www.usc.gal/pcc/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'

mappings:
  arousal:
    sources:
    - [ferre_2012.csv~csv]
    s: emo-resource:annotation/emotionalDimension/arousal/ferre_2012/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:EmotionalDimension', 'emolex:Arousal']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://www.usc.gal/pcc/emofinder/resource/lexicon/ferre_2012']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2012/$(palabra_noaccents)~iri']
    - ['rb:mean', $(activacion_m), 'xsd:float']
    - ['rb:standardDeviation', $(activacion_sd), 'xsd:float']
  concreteness:
    sources:
    - [ferre_2012.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/concreteness/ferre_2012/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:Concreteness']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://www.usc.gal/pcc/emofinder/resource/lexicon/ferre_2012']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2012/$(palabra_noaccents)~iri']
    - ['rb:mean', $(concrecion_m), 'xsd:float']
    - ['rb:standardDeviation', $(concrecion_sd), 'xsd:float']
  familiarity:
    sources:
    - [ferre_2012.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/familiarity/ferre_2012/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:Familiarity']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://www.usc.gal/pcc/emofinder/resource/lexicon/ferre_2012']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2012/$(palabra_noaccents)~iri']
    - ['rb:mean', $(familiaridad_m), 'xsd:float']
    - ['rb:standardDeviation', $(familiaridad_sd), 'xsd:float']
  valence:
    sources:
    - [ferre_2012.csv~csv]
    s: emo-resource:annotation/emotionalDimension/valence/ferre_2012/$(palabra_noaccents)
    po:
    - [ a, ['emolex:Annotation', 'emolex:EmotionalDimension', 'emolex:Valence']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://www.usc.gal/pcc/emofinder/resource/lexicon/ferre_2012']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2012/$(palabra_noaccents)~iri']
    - ['rb:mean', $(valencia_m), 'xsd:float']
    - ['rb:standardDeviation', $(valencia_sd), 'xsd:float']
