prefixes:
  emo-resource: 'https://w3id.org/citius-kg/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'

mappings:
  anger:
    sources:
    - [ferre_2017.csv~csv]
    s: emo-resource:annotation/discreteEmotionalCategory/anger/ferre_2017/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:DiscreteEmotionalCategory', 'emolex:Anger']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/ferre_2017']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2017/$(palabra_noaccents)~iri']
    - ['rb:mean', $(ira_m), 'xsd:float']
    - ['rb:standardDeviation', $(ira_sd), 'xsd:float']
  disgust:
    sources:
    - [ferre_2017.csv~csv]
    s: emo-resource:annotation/discreteEmotionalCategory/disgust/ferre_2017/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:DiscreteEmotionalCategory', 'emolex:Disgust']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/ferre_2017']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2017/$(palabra_noaccents)~iri']
    - ['rb:mean', $(asco_m), 'xsd:float']
    - ['rb:standardDeviation', $(asco_sd), 'xsd:float']
  fear:
    sources:
    - [ferre_2017.csv~csv]
    s: emo-resource:annotation/discreteEmotionalCategory/fear/ferre_2017/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:DiscreteEmotionalCategory', 'emolex:Fear']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/ferre_2017']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2017/$(palabra_noaccents)~iri']
    - ['rb:mean', $(miedo_m), 'xsd:float']
    - ['rb:standardDeviation', $(miedo_sd), 'xsd:float']
  happiness:
    sources:
    - [ferre_2017.csv~csv]
    s: emo-resource:annotation/discreteEmotionalCategory/happiness/ferre_2017/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:DiscreteEmotionalCategory', 'emolex:Happiness']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/ferre_2017']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2017/$(palabra_noaccents)~iri']
    - ['rb:mean', $(alegria_m), 'xsd:float']
    - ['rb:standardDeviation', $(alegria_sd), 'xsd:float']
  sadness:
    sources:
    - [ferre_2017.csv~csv]
    s: emo-resource:annotation/discreteEmotionalCategory/sadness/ferre_2017/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:DiscreteEmotionalCategory', 'emolex:Sadness']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/ferre_2017']
    - ['emolex:affects', 'emo-resource:lexical_entry/ferre_2017/$(palabra_noaccents)~iri']
    - ['rb:mean', $(tristeza_m), 'xsd:float']
    - ['rb:standardDeviation', $(tristeza_sd), 'xsd:float']
