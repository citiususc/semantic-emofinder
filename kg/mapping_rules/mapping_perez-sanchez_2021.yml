prefixes:
  emo-resource: 'https://w3id.org/citius-kg/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'

mappings:
  acquisitionAge:
    sources:
    - [perez-sanchez_2021.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/acquisitionAge/perez-sanchez_2021/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:AcquisitionAge']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/perez-sanchez_2021']
    - ['emolex:affects', 'emo-resource:lexical_entry/perez-sanchez_2021/$(palabra_noaccents)~iri']
    - ['rb:mean', $(AoA_Mean), 'xsd:float']
    - ['rb:standardDeviation', $(AoA_SD), 'xsd:float']
