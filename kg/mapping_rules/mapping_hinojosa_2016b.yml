prefixes:
  emo-resource: 'https://w3id.org/citius-kg/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'


mappings:
  acquisitionAge:
    sources:
    - [hinojosa_2016b.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/acquisitionAge/hinojosa_2016b/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:AcquisitionAge']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/hinojosa_2016b']
    - ['emolex:affects', 'emo-resource:lexical_entry/hinojosa_2016b/$(palabra_noaccents)~iri']
    - ['rb:mean', $(edad_de_adquisicion_m), 'xsd:float']
    - ['rb:standardDeviation', $(edad_de_adquisicion_sd), 'xsd:float']
  dominance:
    sources:
    - [hinojosa_2016b.csv~csv]
    s: emo-resource:annotation/emotionalDimension/dominance/hinojosa_2016b/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:EmotionalDimension', 'emolex:Dominance']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/hinojosa_2016b']
    - ['emolex:affects', 'emo-resource:lexical_entry/hinojosa_2016b/$(palabra_noaccents)~iri']
    - ['rb:mean', $(dominancia_m), 'xsd:float']
    - ['rb:standardDeviation', $(dominancia_sd), 'xsd:float']
  familiarity:
    sources:
    - [hinojosa_2016b.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/familiarity/hinojosa_2016b/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:Familiarity']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/hinojosa_2016b']
    - ['emolex:affects', 'emo-resource:lexical_entry/hinojosa_2016b/$(palabra_noaccents)~iri']
    - ['rb:mean', $(familiaridad_m), 'xsd:float']
    - ['rb:standardDeviation', $(familiaridad_sd), 'xsd:float']
  sensoryExperience:
    sources:
    - [hinojosa_2016b.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/sensoryExperience/hinojosa_2016b/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:SensoryExperience']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/hinojosa_2016b']
    - ['emolex:affects', 'emo-resource:lexical_entry/hinojosa_2016b/$(palabra_noaccents)~iri']
    - ['rb:mean', $(experiencia_sensorial_m), 'xsd:float']
    - ['rb:standardDeviation', $(experiencia_sensorial_sd), 'xsd:float']
