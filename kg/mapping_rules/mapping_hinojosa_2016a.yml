prefixes:
  emo-resource: 'https://w3id.org/citius-kg/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'

mappings:
  anger:
    sources:
    - [hinojosa_2016a.csv~csv]
    s: emo-resource:annotation/discreteEmotionalCategory/anger/hinojosa_2016a/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:DiscreteEmotionalCategory', 'emolex:Anger']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/hinojosa_2016a']
    - ['emolex:affects', 'emo-resource:lexical_entry/hinojosa_2016a/$(palabra_noaccents)~iri']
    - ['rb:mean', $(ira_m), 'xsd:float']
    - ['rb:standardDeviation', $(ira_sd), 'xsd:float']
  arousal:
