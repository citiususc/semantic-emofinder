prefixes:
  emo-resource: 'https://w3id.org/citius-kg/emofinder/resource/'
  emolex: 'https://w3id.org/def/emolex#'
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#'
  skos: 'http://www.w3.org/2004/02/skos/core#'
  ontolex: 'http://www.w3.org/ns/lemon/ontolex#'
  rb: 'https://w3id.org/riverbench/schema/metadata#'
  bibo: 'http://purl.org/ontology/bibo/'
  lexinfo: 'http://www.lexinfo.net/ontology/3.0/lexinfo#'
  lime: 'http://www.w3.org/ns/lemon/lime#'
  dcterms: 'http://purl.org/dc/terms/'
  vartrans: 'http://www.w3.org/ns/lemon/vartrans#'

mappings:
  acquisitionAge:
    sources:
    - [haro_2024.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/acquisitionAge/haro_2024/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:AcquisitionAge']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/haro_2024']
    - ['emolex:affects', 'emo-resource:lexical_entry/haro_2024/$(palabra_noaccents)~iri']
    - ['rb:mean', $(aoa), 'xsd:float']
  concreteness:
    sources:
    - [haro_2024.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/concreteness/haro_2024/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:Concreteness']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/haro_2024']
    - ['emolex:affects', 'emo-resource:lexical_entry/haro_2024/$(palabra_noaccents)~iri']
    - ['rb:mean', $(concreteness), 'xsd:float']
  familiarity:
    sources:
    - [haro_2024.csv~csv]
    s: emo-resource:annotation/subjectiveDimension/familiarity/haro_2024/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:SubjectiveDimension', 'emolex:Familiarity']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/haro_2024']
    - ['emolex:affects', 'emo-resource:lexical_entry/haro_2024/$(palabra_noaccents)~iri']
    - ['rb:mean', $(familiarity), 'xsd:float']
  recognitionTimePercentage:
    sources:
    - [haro_2024.csv~csv]
    s: emo-resource:annotation/recognitionTime/recognitionTimePercentage/haro_2024/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:RecognitionTime', 'emolex:RecognitionTimePercentage']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/haro_2024']
    - ['emolex:affects', 'emo-resource:lexical_entry/haro_2024/$(palabra_noaccents)~iri']
    - ['emolex:recognitionTime', $(mean_error), 'xsd:float']
  timeTdl:
    sources:
    - [haro_2024.csv~csv]
    s: emo-resource:annotation/recognitionTime/timeTdl/haro_2024/$(palabra_noaccents)
    po:
    - [a, ['emolex:Annotation', 'emolex:RecognitionTime', 'emolex:TimeTDL']]
    - ['rdfs:label', $(palabra)]
    - ['dcterms:source', 'https://w3id.org/citius-kg/emofinder/resource/lexicon/haro_2024']
    - ['emolex:affects', 'emo-resource:lexical_entry/haro_2024/$(palabra_noaccents)~iri']
    - ['emolex:recognitionTime', $(mean_rt), 'xsd:float']
